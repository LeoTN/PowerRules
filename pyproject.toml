[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "powerrules"
version = "0.2.0b0"
description = "A rule-based computer power state management tool"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10,<4.0"
authors = [
    { name = "LeoTN", email = "LeoTN.GitHub@gmx.net" }
]
keywords = [
    "shutdown",
    "reboot",
    "hibernate",
    "sleep",
    "cli",
    "windows",
    "linux",
    "macos",
    "rules",
    "policy",
    "manager",
    "power",
    "management"
]
classifiers = [
    "Topic :: Utilities",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS"
]
dependencies = [
    "pyyaml>=6.0,<7.0",
    "pydantic>=2.0,<3.0",
    "typer>=0.27.1,<0.28.0",
    "psutil>=7.0,<8.0",
    "pywinctl>=0.4.1,<0.5.0"
]
packages = [
    { include = "powerrules", from = "src" }
]

[project.urls]
homepage = "https://github.com/LeoTN/PowerRules#readme"
repository = "https://github.com/LeoTN/PowerRules"
"Bug Tracker" = "https://github.com/LeoTN/PowerRules/issues"

[project.scripts]
powerrules = "powerrules.cli.app:app"
pwru = "powerrules.cli.app:app"

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.16.4,<0.17.0"
]