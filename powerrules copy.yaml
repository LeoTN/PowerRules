# yaml-language-server: $schema=assets/schema/powerrules_policy.schema.json

# Test policy for the "actions" section (Windows)
#
# Validate:  pwru policy validate --policy actions-test.yaml
# Dry run:   pwru policy run --once --dry-run --policy actions-test.yaml
# Real run:  pwru --log-level DEBUG policy run --once --policy actions-test.yaml
#
# DEBUG is needed to see the standard output of the commands.
# Actions with "continue_on_error" are expected to log a warning, the remaining actions still run.

rules:
  - name: "Actions test"
    enabled: true
    conditions:
      datetime:
        weekday:
          - "Monday"
          - "Tuesday"
          - "Wednesday"
          - "Thursday"
          - "Friday"
          - "Saturday"
          - "Sunday"
        between:
          start: "1"
          end: "23"
    actions:
      # 1: No shell configured, so the default of the platform is used (powershell on Windows)
      - name: "Default shell1"
        run: Write-Output "Hello from the default shell"
        trusted_files:
          - "test_trust.txt"
  - name: "Test rule_MODIFIED"
    conditions:
      datetime:
        weekday:
          - "Monday"
    actions:
      - run: Write-Output "Hello from the test rule"
        trusted_files:
          - "1test_trust.txt"
          - "2test_trust.txt"

      
        