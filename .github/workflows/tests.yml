name: Tests

on:
    pull_request:
        branches:
            - development
            - main
    push:
        branches:
            - development
            - main
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: tests-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
        runs-on: ${{ matrix.os }}
        strategy:
            # A failing platform should not hide the results of the other ones
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
                python-version: ["3.13"]
                include:
                    # The lowest supported Python version
                    - os: ubuntu-latest
                      python-version: "3.11"
        steps:
            - uses: actions/checkout@v6

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Install Poetry
              uses: abatilo/actions-poetry@v4
              with:
                  poetry-version: "2.4.1"

            - name: Install dependencies
              run: |
                  poetry sync

            - name: Run tests
              run: |
                  poetry run pytest

    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.13"

            - name: Install Poetry
              uses: abatilo/actions-poetry@v4
              with:
                  poetry-version: "2.4.1"

            - name: Install dependencies
              run: |
                  poetry sync

            - name: Check code style
              run: |
                  poetry run ruff check .
                  poetry run ruff format --check .
