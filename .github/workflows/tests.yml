name: Tests

on:
    pull_request:
        branches:
            - development
            - main
    push:
        branches:
            - development
            - main
    workflow_dispatch:
    # Allows the release workflow to run the tests before a release is published
    workflow_call:

permissions:
    contents: read

concurrency:
    group: tests-${{ github.workflow }}-${{ github.ref }}
    # Only outdated runs of pull requests are cancelled, a release must never be cancelled by a newer commit
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    test:
        name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 10
        strategy:
            # A failing platform should not hide the results of the other ones
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
                python-version: ["3.13"]
                include:
                    # The lowest supported Python version
                    - os: ubuntu-latest
                      python-version: "3.11"
                    - os: ubuntu-latest
                      python-version: "3.12"
        steps:
            - uses: actions/checkout@v6

            # https://github.com/actions/setup-python/blob/v7/docs/advanced-usage.md#caching-packages
            - name: Install poetry
              run: |
                  pipx install poetry==2.4.1

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: ${{ matrix.python-version }}
                  cache: "poetry"

            - name: Install dependencies
              run: |
                  poetry sync

            - name: Run tests
              run: |
                  poetry run pytest

    lint:
        name: Lint
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v6

            # https://github.com/actions/setup-python/blob/v7/docs/advanced-usage.md#caching-packages
            - name: Install poetry
              run: |
                  pipx install poetry==2.4.1

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.13"
                  cache: "poetry"

            - name: Install dependencies
              run: |
                  poetry sync

            - name: Check code style
              run: |
                  poetry run ruff check --output-format=github .
                  poetry run ruff format --check .

    all_tests_passed:
        name: All tests passed
        runs-on: ubuntu-latest
        needs: [test, lint]
        # Must run even if a dependent job failed, otherwise this job would be skipped and count as "not required"
        if: always()
        steps:
            - name: Check test results
              run: |
                  if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
                    echo "[ERROR] One or more required tests did not pass"
                    exit 1
                  fi

                  echo "[INFO] All required tests passed"
