name: Publish a new release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release Version (1.2.3 or 1.2.3b4)"
        required: true
        type: string

  workflow_call:
    inputs:
      version:
        description: "Release Version (1.2.3 or 1.2.3b4)"
        required: true
        type: string

permissions:
  contents: read

env:
  PACKAGE_NAME: "powerrules"
  PYPI_REPOSITORY_URL: "https://upload.pypi.org/legacy/"
  # Normal (non-beta) releases can only be published from this branch
  STABLE_RELEASE_BRANCH: "main"

jobs:
  validate_version:
    name: Validate version input
    runs-on: ubuntu-latest
    outputs:
      is_beta: ${{ steps.check_version.outputs.is_beta }}
    steps:
      - name: Validate version input
        id: check_version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(b[0-9]+)?$ ]]; then
              echo "Invalid version format: $VERSION"
              echo "Use X.Y.Z or X.Y.ZbN (only normal or beta releases allowed)"
              exit 1
          else
              # Check if it's a beta version
              if [[ "$VERSION" == *b* ]]; then
                  echo "Version $VERSION is a beta release"
                  echo "is_beta=true" >> "$GITHUB_OUTPUT"
              else
                  # Normal releases are only allowed from the release branch, so that only merged changes are released
                  if [[ "$REF_NAME" != "$STABLE_RELEASE_BRANCH" ]]; then
                      echo "[ERROR] Normal releases can only be published from the '$STABLE_RELEASE_BRANCH' branch (current ref: $REF_NAME)"
                      exit 1
                  fi

                  echo "Version $VERSION is a normal release"
                  echo "is_beta=false" >> "$GITHUB_OUTPUT"
              fi
          fi

  gather_details:
    name: Gather release details
    needs: validate_version
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.release.outputs.new_version }}
      suffix: ${{ steps.release.outputs.suffix }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      is_beta: ${{ needs.validate_version.outputs.is_beta }}
    steps:
      - uses: actions/checkout@v6

      - name: Extract tag and gather_details
        id: release
        env:
          TAG_NAME: ${{ inputs.version }}
        run: |
          NEW_VERSION=$(echo "$TAG_NAME" | awk -F'-' '{print $1}')
          SUFFIX=$(echo "$TAG_NAME" | grep -oP '[a-z]+[0-9]+' || echo "")
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "suffix=$SUFFIX" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "Version is $NEW_VERSION"
          echo "Suffix is $SUFFIX"
          echo "Tag name is $TAG_NAME"

      - name: Ensure the tag does not exist yet
        env:
          TAG_NAME: ${{ inputs.version }}
        run: |
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/$TAG_NAME" > /dev/null || status=$?

          if [ "$status" -eq 0 ]; then
            echo "[ERROR] The tag $TAG_NAME already exists"
            exit 1
          elif [ "$status" -ne 2 ]; then
            echo "[ERROR] Could not check whether the tag $TAG_NAME exists (exit code $status)"
            exit 1
          fi

          echo "[INFO] The tag $TAG_NAME does not exist yet"

  check_pypi:
    name: Check version on PyPI
    needs: gather_details
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install packaging
        run: python3 -m pip install packaging --upgrade

      - name: Fetch latest PyPI version
        run: |
          # Get the latest version from PyPI
          latest_previous_version=$(curl -s "https://pypi.org/pypi/$PACKAGE_NAME/json" | \
          grep -Po '"version":\s*"\K[0-9A-Za-z\.\-]+(?=")' | tail -n 1)

          if [ -z "$latest_previous_version" ]; then
            echo "[ERROR] Package (version) not found on PyPI."
            exit 1
          fi

          echo "[INFO] Latest version on PyPI: $latest_previous_version"
          echo "latest_previous_version=$latest_previous_version" >> $GITHUB_ENV

      - name: Compare versions and exit if not newer
        env:
          NEW_VERSION: ${{ needs.gather_details.outputs.new_version }}
        run: |
          python3 - <<'EOF'
          import os
          import sys

          from packaging.version import parse

          new_version = parse(os.environ["NEW_VERSION"])
          latest_version = parse(os.environ["latest_previous_version"])

          if new_version > latest_version:
              print(f"[INFO] The new version {new_version} is greater than the latest version {latest_version} on PyPI")
          else:
              print(f"[INFO] The new version {new_version} is not greater than the latest version {latest_version} on PyPI")
              sys.exit(1)
          EOF

  build_and_publish:
    name: Build and publish package to PyPI
    needs: [gather_details, check_pypi]
    runs-on: ubuntu-latest
    env:
      # The version is not stored in the repository, it is set explicitly for this run
      POETRY_DYNAMIC_VERSIONING_BYPASS: ${{ needs.gather_details.outputs.new_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Build exactly the commit which is tagged by the release later
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Poetry
        uses: abatilo/actions-poetry@v4
        with:
          poetry-version: "2.4.1"

      - name: Install dependencies
        run: |
          poetry sync
          poetry install --no-interaction

      - name: Build source and wheel distribution
        run: |
          poetry build

      - name: Verify built version
        env:
          VERSION: ${{ needs.gather_details.outputs.new_version }}
        run: |
          # Make sure that the versioning plugin was active, otherwise the placeholder 0.0.0 would be published
          for file in dist/*; do
            case "$(basename "$file")" in
              "${PACKAGE_NAME}-${VERSION}.tar.gz" | "${PACKAGE_NAME}-${VERSION}-"*.whl) ;;
              *)
                echo "[ERROR] Unexpected file in dist: $file (expected version $VERSION)"
                exit 1
                ;;
            esac
          done
          ls dist/

      - name: Publish to PyPI
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          poetry config repositories.pypirepository "$PYPI_REPOSITORY_URL"
          poetry publish --repository pypirepository --username __token__ --password "$PYPI_API_TOKEN"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  delete_old_betas:
    name: Cleanup old beta tags and releases
    needs: build_and_publish
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Fetch all history for all tags and branches
          fetch-depth: 0

      - name: Delete old beta tags and releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # List all beta tags
          beta_tags=$(git tag --list '*b[0-9]*')
          if [ -z "$beta_tags" ]; then
            echo "[INFO] No beta tags found. Nothing to delete."
            exit 0
          fi

          echo "[INFO] Beta tags to delete: $beta_tags"

          for tag in $beta_tags; do
            echo "[INFO] Deleting beta release and tag: $tag"

            # Get release ID(s) for the tag
            RELEASE_IDS=$(gh api -X GET "/repos/$GITHUB_REPOSITORY/releases" | jq -r ".[] | select(.tag_name==\"$tag\") | .id")

            for id in $RELEASE_IDS; do
              echo "[INFO] Deleting release ID: $id for tag $tag"
              gh api -X DELETE "/repos/$GITHUB_REPOSITORY/releases/$id"
            done

            # Delete the tag locally and remotely
            git tag --delete "$tag" || true
            git push --delete origin "$tag" || true

            echo "[INFO] Deleted tag and release(s) for: $tag"
          done

          echo "[INFO] Cleanup of beta releases complete"

  github_release:
    name: Publish GitHub release
    needs: [gather_details, delete_old_betas]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Create GitHub release
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_BETA: ${{ needs.gather_details.outputs.is_beta }}
          TAG_NAME: ${{ needs.gather_details.outputs.tag_name }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          if [ "$IS_BETA" = "true" ]; then
              gh release create "$TAG_NAME" dist/* --title "$TAG_NAME" --prerelease --target "$TARGET_SHA"
          else
              gh release create "$TAG_NAME" dist/* --title "$TAG_NAME" --generate-notes --target "$TARGET_SHA"
          fi
