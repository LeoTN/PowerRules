name: Publish a new release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release Version (1.2.3 or 1.2.3b4)"
        required: true
        type: string

  push:
    branches:
      - development
    paths:
      # Only changes which end up in the published package should create a new beta release
      - "src/powerrules/**"
      - "pyproject.toml"

permissions:
  contents: read

env:
  PACKAGE_NAME: "powerrules"
  # Normal (non-beta) releases can only be published from this branch
  STABLE_RELEASE_BRANCH: "main"

jobs:
  determine_version:
    name: Determine release version
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      version: ${{ steps.set_release_version.outputs.version }}
      is_beta: ${{ steps.set_release_version.outputs.is_beta }}
      should_release: ${{ steps.set_release_version.outputs.should_release }}
    steps:
      # The following steps are only needed to derive a beta version for a push, a manual run provides the version itself
      - name: Checkout repository
        if: github.event_name == 'push'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        if: github.event_name == 'push'
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install packaging
        if: github.event_name == 'push'
        run: python3 -m pip install packaging --upgrade

      - name: Determine beta version
        if: github.event_name == 'push'
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python3 - <<'EOF'
          import os
          import re
          import subprocess

          from packaging.version import Version

          BETA_PATTERN = re.compile(
              r"^(?P<major>[0-9]+)\.(?P<minor>[0-9]+)\." r"(?P<patch>[0-9]+)b(?P<beta>[0-9]+)$"
          )
          STABLE_PATTERN = re.compile(
              r"^(?P<major>[0-9]+)\.(?P<minor>[0-9]+)\.(?P<patch>[0-9]+)$"
          )


          def get_released_versions() -> tuple[Version, ...]:
              result = subprocess.run(
                  [
                      "gh",
                      "release",
                      "list",
                      "--repo",
                      os.environ["GITHUB_REPOSITORY"],
                  ],
                  capture_output=True,
                  text=True,
                  check=True,
              )

              released_versions = tuple()

              for line in result.stdout.splitlines():
                  if not line.strip():
                      continue

                  tag = line.split()[0]

                  try:
                      released_versions += (Version(tag),)
                  except Exception:
                      continue

              return released_versions


          def get_automatic_release_type() -> str | None:
              commit_message = os.environ.get("COMMIT_MESSAGE", "")
              commit_lines = commit_message.splitlines()

              if not commit_lines:
                  return None

              # Only evaluate the subject of the commit that triggered the workflow
              commit_subject = commit_lines[0].strip()

              if re.fullmatch(r"(?:fix|hotfix)[:/]\s*.+", commit_subject):
                  return "PATCH"

              if re.fullmatch(
                  r"(?:feat|feature|improvement|enhancement)[:/]\s*.+", commit_subject
              ):
                  return "MINOR"

              return None


          released_versions = get_released_versions()

          if not released_versions:
              print("[ERROR] No released versions could be determined")
              raise SystemExit(1)

          latest_version = max(released_versions)


          #############################################
          # Increment the already existing beta version
          #############################################

          if BETA_PATTERN.fullmatch(str(latest_version)):
              major = latest_version.major
              minor = latest_version.minor
              patch = latest_version.micro
              pre_release = latest_version.pre

              if pre_release is None or pre_release[0] != "b":
                  print("[ERROR] Could not determine beta number")
                  raise SystemExit(1)

              beta = pre_release[1]
              next_beta = f"{major}.{minor}.{patch}b{beta + 1}"

              print(f"[INFO] Existing beta release found: {latest_version}")
              print(f"[INFO] New beta version: {next_beta}")

              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
                  env_file.write(f"FINAL_VERSION={next_beta}\n")
                  env_file.write("SHOULD_RELEASE=true\n")

              raise SystemExit(0)


          ####################################################################################################
          # No existing beta version is available, determine the next beta version based on the commit message
          ####################################################################################################

          # Determine the release type based on the commit message subject (fix: -> PATCH, feat: -> MINOR)
          release_type = get_automatic_release_type()

          if release_type is None:
              print(
                  "[INFO] Commit message does not define a release type. Use one of the following prefixes:\n\n"
                  "       PATCH: fix|hotfix[:/]\n"
                  "       MINOR: feat|feature|improvement|enhancement[:/]\n\n"
              )
              print("[INFO] No beta release will be created")

              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
                  env_file.write("SHOULD_RELEASE=false\n")

              raise SystemExit(0)

          print(f"[INFO] Release type derived from commit message: {release_type}")


          # Determine the latest stable release
          latest_stable = max(
              (
                  version
                  for version in released_versions
                  if STABLE_PATTERN.fullmatch(str(version))
              ),
              default=None,
          )

          if latest_stable is None:
              print("[ERROR] No stable release could be determined")
              raise SystemExit(1)

          if release_type == "PATCH":
              # Increment patch version +1
              next_version = (
                  f"{latest_stable.major}.{latest_stable.minor}.{latest_stable.micro + 1}b0"
              )
          elif release_type == "MINOR":
              # Increment minor version +1
              next_version = f"{latest_stable.major}.{latest_stable.minor + 1}.0b0"
          else:
              print(f"[ERROR] Unsupported release type: {release_type}")
              raise SystemExit(1)


          print(f"[INFO] Latest stable release: {latest_stable}")
          print(f"[INFO] New beta version: {next_version}")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"FINAL_VERSION={next_version}\n")
              env_file.write("SHOULD_RELEASE=true\n")
          EOF

      - name: Validate version and set outputs
        id: set_release_version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # A manual run always releases the given version, a push uses the beta version determined above
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
              RELEASE_VERSION="$MANUAL_VERSION"
              SHOULD_RELEASE="true"
          else
              RELEASE_VERSION="${FINAL_VERSION:-}"
          fi

          if [[ "${SHOULD_RELEASE:-}" != "true" ]]; then
              echo "[INFO] No release will be created"
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              exit 0
          fi

          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(b[0-9]+)?$ ]]; then
              echo "[ERROR] Invalid version format: $RELEASE_VERSION"
              echo "Use X.Y.Z or X.Y.ZbN (only normal or beta releases allowed)"
              exit 1
          fi

          # Check if it's a beta version
          if [[ "$RELEASE_VERSION" == *b* ]]; then
              echo "[INFO] Version $RELEASE_VERSION is a beta release"
              echo "is_beta=true" >> "$GITHUB_OUTPUT"
          else
              # Normal releases are only allowed from the release branch, so that only merged changes are released
              if [[ "$REF_NAME" != "$STABLE_RELEASE_BRANCH" ]]; then
                  echo "[ERROR] Normal releases can only be published from the '$STABLE_RELEASE_BRANCH' branch (current ref: $REF_NAME)"
                  exit 1
              fi

              echo "[INFO] Version $RELEASE_VERSION is a normal release"
              echo "is_beta=false" >> "$GITHUB_OUTPUT"
          fi

          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"

  gather_details:
    name: Gather release details
    needs: determine_version
    # All following jobs depend on this one, so they are skipped as well if no release is created
    if: needs.determine_version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.release.outputs.new_version }}
      suffix: ${{ steps.release.outputs.suffix }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      is_beta: ${{ needs.determine_version.outputs.is_beta }}
    steps:
      - uses: actions/checkout@v6

      - name: Extract tag and gather_details
        id: release
        env:
          TAG_NAME: ${{ needs.determine_version.outputs.version }}
        run: |
          NEW_VERSION=$(echo "$TAG_NAME" | awk -F'-' '{print $1}')
          SUFFIX=$(echo "$TAG_NAME" | grep -oP '[a-z]+[0-9]+' || echo "")
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "suffix=$SUFFIX" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "Version is $NEW_VERSION"
          echo "Suffix is $SUFFIX"
          echo "Tag name is $TAG_NAME"

      - name: Ensure the tag does not exist yet
        env:
          TAG_NAME: ${{ needs.determine_version.outputs.version }}
        run: |
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/$TAG_NAME" > /dev/null || status=$?

          if [ "$status" -eq 0 ]; then
            echo "[ERROR] The tag $TAG_NAME already exists"
            exit 1
          elif [ "$status" -ne 2 ]; then
            echo "[ERROR] Could not check whether the tag $TAG_NAME exists (exit code $status)"
            exit 1
          fi

          echo "[INFO] The tag $TAG_NAME does not exist yet"

  check_pypi:
    name: Check version on PyPI
    needs: gather_details
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install packaging
        run: python3 -m pip install packaging --upgrade

      - name: Fetch latest PyPI version
        run: |
          # Get the latest version from PyPI
          latest_previous_version=$(curl -s "https://pypi.org/pypi/$PACKAGE_NAME/json" | \
          grep -Po '"version":\s*"\K[0-9A-Za-z\.\-]+(?=")' | tail -n 1)

          if [ -z "$latest_previous_version" ]; then
            echo "[ERROR] Package (version) not found on PyPI."
            exit 1
          fi

          echo "[INFO] Latest version on PyPI: $latest_previous_version"
          echo "latest_previous_version=$latest_previous_version" >> $GITHUB_ENV

      - name: Compare versions and exit if not newer
        env:
          NEW_VERSION: ${{ needs.gather_details.outputs.new_version }}
        run: |
          python3 - <<'EOF'
          import os
          import sys

          from packaging.version import parse

          new_version = parse(os.environ["NEW_VERSION"])
          latest_version = parse(os.environ["latest_previous_version"])

          if new_version > latest_version:
              print(f"[INFO] The new version {new_version} is greater than the latest version {latest_version} on PyPI")
          else:
              print(f"[INFO] The new version {new_version} is not greater than the latest version {latest_version} on PyPI")
              sys.exit(1)
          EOF

  tests:
    name: Run tests
    needs: check_pypi
    uses: ./.github/workflows/tests.yml

  build_executables:
    name: Build executable (${{ matrix.os }})
    needs: [gather_details, check_pypi, tests]
    runs-on: ${{ matrix.os }}
    # https://github.com/actions/attest#usage
    permissions:
      contents: read
      id-token: write
      attestations: write
    # Always use bash so that POSIX-style variables like $EXPECTED_VERSION work on Windows as well
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # Pinned OS version instead of latest, so the environment do not change unexpectedly
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025, macos-26]
    env:
      POETRY_DYNAMIC_VERSIONING_BYPASS: ${{ needs.gather_details.outputs.new_version }}
    steps:
      - uses: actions/checkout@v6

      # https://github.com/actions/setup-python/blob/v7/docs/advanced-usage.md#caching-packages
      - name: Install poetry
        run: |
          pipx install poetry==2.4.1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "poetry"

      - name: Install dependencies
        # Only install the dependencies, but not PowerRules itself
        run: |
          poetry sync --no-root

      # Install the package non-editable, so the version comes from the build backend (POETRY_DYNAMIC_VERSIONING_BYPASS) and Nuitka finds the package files in the distribution
      - name: Install package non-editable
        run: |
          poetry run pip install --no-deps .

      - name: Build executable
        env:
          EXPECTED_VERSION: ${{ needs.gather_details.outputs.new_version }}
        run: |
          poetry run python devscripts/build_executable.py --output-dir dist/executable --expected-version "$EXPECTED_VERSION"

      - name: Upload executable artifact
        uses: actions/upload-artifact@v7
        with:
          name: executable-${{ matrix.os }}
          path: dist/executable/powerrules-*

      - name: Attestation
        uses: actions/attest@v4
        with:
          subject-path: dist/executable/powerrules-*

  build_package:
    name: Build package
    # The executables need to be built correctly before a PyPI release is created
    needs: [gather_details, check_pypi, tests, build_executables]
    runs-on: ubuntu-latest
    env:
      # The version is not stored in the repository, it is set explicitly for this run
      POETRY_DYNAMIC_VERSIONING_BYPASS: ${{ needs.gather_details.outputs.new_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Build exactly the commit which is tagged by the release later
          ref: ${{ github.sha }}

      # https://github.com/actions/setup-python/blob/v7/docs/advanced-usage.md#caching-packages
      - name: Install poetry
        run: |
          pipx install poetry==2.4.1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "poetry"

      - name: Install dependencies
        # Only install the dependencies, but not PowerRules itself
        run: |
          poetry sync --no-root

      - name: Build source and wheel distribution
        run: |
          poetry build

      - name: Verify built version
        env:
          VERSION: ${{ needs.gather_details.outputs.new_version }}
        run: |
          # Make sure that the versioning plugin was active, otherwise the placeholder 0.0.0 would be published
          for file in dist/*; do
            case "$(basename "$file")" in
              "${PACKAGE_NAME}-${VERSION}.tar.gz" | "${PACKAGE_NAME}-${VERSION}-"*.whl) ;;
              *)
                echo "[ERROR] Unexpected file in dist: $file (expected version $VERSION)"
                exit 1
                ;;
            esac
          done
          ls dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish_pypi:
    name: Publish package to PyPI
    # Only this job may request the OIDC token for PyPI Trusted Publishing, no project code is executed here
    needs: build_package
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/${{ env.PACKAGE_NAME }}
    permissions:
      id-token: write
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # Pinned to the commit of the release tag instead of a moving ref, because this action may publish to PyPI
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  delete_old_betas:
    name: Cleanup old beta tags and releases
    needs: publish_pypi
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Fetch all history for all tags and branches
          fetch-depth: 0

      - name: Delete old beta tags and releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # List all beta tags
          beta_tags=$(git tag --list '*b[0-9]*')
          if [ -z "$beta_tags" ]; then
            echo "[INFO] No beta tags found. Nothing to delete."
            exit 0
          fi

          echo "[INFO] Beta tags to delete: $beta_tags"

          for tag in $beta_tags; do
            echo "[INFO] Deleting beta release and tag: $tag"

            # Get release ID(s) for the tag
            RELEASE_IDS=$(gh api -X GET "/repos/$GITHUB_REPOSITORY/releases" | jq -r ".[] | select(.tag_name==\"$tag\") | .id")

            for id in $RELEASE_IDS; do
              echo "[INFO] Deleting release ID: $id for tag $tag"
              gh api -X DELETE "/repos/$GITHUB_REPOSITORY/releases/$id"
            done

            # Delete the tag locally and remotely
            git tag --delete "$tag" || true
            git push --delete origin "$tag" || true

            echo "[INFO] Deleted tag and release(s) for: $tag"
          done

          echo "[INFO] Cleanup of beta releases complete"

  github_release:
    name: Publish GitHub release
    needs: [gather_details, delete_old_betas]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Download executable artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: executable-*
          path: executables/
          merge-multiple: true

      - name: Create GitHub release
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_BETA: ${{ needs.gather_details.outputs.is_beta }}
          TAG_NAME: ${{ needs.gather_details.outputs.tag_name }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          if [ "$IS_BETA" = "true" ]; then
              gh release create "$TAG_NAME" dist/* executables/* --title "$TAG_NAME" --prerelease --target "$TARGET_SHA"
          else
              gh release create "$TAG_NAME" dist/* executables/* --title "$TAG_NAME" --generate-notes --target "$TARGET_SHA"
          fi
